<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mon</title>
    <meta name="description" content="Exam-aligned spaced repetition for Mandarin, Japanese, Korean and Vietnamese." />
    <!--
      Painted before any JavaScript runs, from the same ink and canvas the
      palettes use, so a slow connection shows the app's background rather than
      a white flash that then turns dark.
    -->
    <meta name="color-scheme" content="light dark" />

    <!--
      Generated by `npm run icons` from the 門 glyph, and regenerated as part of
      every build — there is no checked-in bitmap to drift out of date. The
      light/dark pair uses media queries so the favicon follows the browser
      theme rather than disappearing into one of them.
    -->
    <link rel="icon" href="icon.svg" type="image/svg+xml" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="icon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="apple-touch-icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; background: #FBFAF8; }
      @media (prefers-color-scheme: dark) { html, body { background: #0B0B0C; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
