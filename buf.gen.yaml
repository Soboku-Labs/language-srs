# Code generation from the contract.
#
# One plugin. `protoc-gen-es` v2 emits the service descriptors alongside the
# message types, and Connect v2 consumes those descriptors directly — the
# separate `protoc-gen-connect-es` that v1 needed no longer exists. Less
# generated code, and one fewer version to keep in step with the runtime.
#
# Output is committed. A generated file in the tree is reviewable in a diff,
# builds without the buf binary present, and makes "the proto changed but
# nobody regenerated" a visible conflict rather than a mystery at runtime.
#
# It lands in `packages/api` rather than in the server, because the server is not
# the only thing that speaks this contract. The web app needs the same message
# types, and — more to the point — the same enum tables, in the opposite
# direction. Two copies of "CARD_KIND_READING means 'reading'" is how one of them
# ends up meaning 'writing'.
#
# Run: npm run proto:generate
version: v2
clean: true
plugins:
  - local: protoc-gen-es
    out: packages/api/src/gen
    opt:
      - target=ts
      # Extensionless, matching `@mon/core`. The web app and the Expo app both
      # consume this package and neither enables `allowImportingTsExtensions`, so
      # a `.ts` in a generated import is an error in two builds at once.
      - import_extension=none
