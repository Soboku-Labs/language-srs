<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mon">
  <title>Mon</title>
  <rect width="512" height="512" rx="0" fill="#FBFAF8"/>
  <!--
    門, drawn as strokes. The same ten segments as
    apps/web/src/components/Logo.tsx at 16x the scale.

    Not `<text>門</text>`: an SVG favicon loads no fonts, so the glyph rendered
    differently on every machine and as an empty box on one without a CJK font.
    An icon is the one image that has to look the same everywhere.
  -->
  <g stroke="#B8521F" fill="none" stroke-width="41.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M88 144v304"/>
    <path d="M88 144h120"/>
    <path d="M88 240h120"/>
    <path d="M88 336h120"/>
    <path d="M208 144v192"/>
    <path d="M304 144v192"/>
    <path d="M304 144h120"/>
    <path d="M304 240h120"/>
    <path d="M304 336h120"/>
    <path d="M424 144v304"/>
  </g>
</svg>
