<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!--
      Title and description, written for a search result rather than for us.

      The old title was "Mon", which tells somebody scanning ten results
      nothing at all — a brand name only works as a title once people already
      know the brand. This leads with what it is and which languages, because
      that is what the search was.

      Kept under 60 characters so it is not truncated, and the description
      under 160 for the same reason.
    -->
    <title>Mon — exam-aligned review for HSK, JLPT, TOPIK</title>
    <meta
      name="description"
      content="Spaced repetition built around your exam date. Mandarin, Japanese, Korean and Vietnamese, scheduled so nothing lands after the paper. Free, works offline."
    />
    <link rel="canonical" href="%SITE_URL%" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!--
      Open Graph and Twitter, so a shared link is a card rather than a bare URL.

      `og:image` is the maskable icon: an orange square with the gate in it,
      which is legible at the size these are shown and does not depend on a
      font being installed.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mon" />
    <meta property="og:title" content="Mon — exam-aligned review for HSK, JLPT, TOPIK" />
    <meta
      property="og:description"
      content="Spaced repetition built around your exam date. Mandarin, Japanese, Korean and Vietnamese, scheduled so nothing lands after the paper."
    />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%icon-maskable.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mon — exam-aligned review for HSK, JLPT, TOPIK" />
    <meta
      name="twitter:description"
      content="Spaced repetition built around your exam date. Mandarin, Japanese, Korean and Vietnamese."
    />
    <meta name="twitter:image" content="%SITE_URL%icon-maskable.svg" />

    <!--
      Painted before any JavaScript runs, from the same ink and canvas the
      palettes use, so a slow connection shows the app's background rather than
      a white flash that then turns dark.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FBFAF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)" />

    <!--
      The gate, drawn as paths. See apps/web/src/components/Logo.tsx: these used
      to be the glyph 門 set as `<text>`, which rendered as an empty box on any
      machine without a CJK font installed.
    -->
    <!--
      Absolute, via Vite's build-time base, rather than relative.

      Every unmatched path is served this same document, so a relative href is
      resolved against whatever URL the learner happened to open. From
      /word/zh-nihao, "icon.svg" means /word/icon.svg and the icons and the
      installable manifest both 404 — on exactly the deep links somebody is
      most likely to have bookmarked or shared.

      The manifest's own relative entries are fine: those resolve against the
      manifest's URL, so fixing this one link fixes start_url and the icons
      inside it too.
    -->
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="%BASE_URL%icon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <!--
      Structured data.

      A search engine cannot tell from the markup that this is an application
      rather than an article, that it is free, or which languages it teaches.
      Stated here so the result can carry that, and kept to what is actually
      true: no rating, no review count, no invented install figures.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Mon",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "url": "%SITE_URL%",
        "description": "Spaced repetition built around your exam date, for Mandarin, Japanese, Korean and Vietnamese.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "publisher": { "@type": "Organization", "name": "Suboku Labs" },
        "inLanguage": ["zh", "ja", "ko", "vi"],
        "featureList": [
          "FSRS scheduling with exam-date pressure",
          "HSK, JLPT, TOPIK and Vietnamese exam tracks",
          "Grammar read first, then practised",
          "Works offline, no account required"
        ]
      }
    </script>

    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; background: #FBFAF8; }
      @media (prefers-color-scheme: dark) { html, body { background: #0B0B0C; } }
      /* Only ever seen by a crawler that does not run scripts, and by anybody
         who has turned them off. It is real content, not a "please enable
         JavaScript" notice, because the former is useful to both. */
      .nojs { max-width: 42rem; margin: 0 auto; padding: 2rem 1rem; font-family: system-ui, sans-serif; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <noscript>
      <div class="nojs">
        <h1>Mon — exam-aligned review for HSK, JLPT, TOPIK and Vietnamese</h1>
        <p>
          Mon is a spaced-repetition app built around the exam you have booked. It schedules
          with FSRS and tightens intervals as the date approaches, so nothing is scheduled to
          land after the paper.
        </p>
        <h2>The languages</h2>
        <ul>
          <li><strong>Mandarin Chinese</strong> — HSK 2.0 and HSK 3.0, with official word lists.</li>
          <li><strong>Japanese</strong> — JLPT N5 to N1.</li>
          <li><strong>Korean</strong> — TOPIK I and II.</li>
          <li><strong>Vietnamese</strong> — the six-level Vietnamese framework.</li>
        </ul>
        <h2>How it teaches</h2>
        <p>
          Meaning, listening, production and tones are scheduled separately, because recognising
          a word and being able to say it are different memories that fade at different rates.
          Grammar is read first and practised afterwards — matching, filling a gap, typing it,
          and explaining the rule back.
        </p>
        <p>It needs JavaScript to run. It works offline once loaded, and an account is optional.</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
